name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml # zizmor: ignore[self-repository] actionlint v1.7.12 rejects the $/ form

  build:
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a-stack_linux_${{ matrix.arch }}
          path: dist/a-stack_linux_${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A re-run, for example after a tag was pushed again, keeps the existing release.
      - id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::A release for $GITHUB_REF_NAME already exists. This run does not change it. To publish again, delete the release first."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # The notes are the CHANGELOG.md section of the tag, such as "## [0.1.1] - 2026-10-24".
      - run: |
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { p = index($0, "## [" v "]") == 1; next }
            /^\[[^]]*\]: / { p = 0 }
            p' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi
          printf '\nTo update, run the install script again and restart the service. See [Update](https://github.com/mzmzeee/a-stack/blob/%s/docs/install.md#update).\n' "$GITHUB_REF_NAME" >> "$notes"
          cat "$notes"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: |
          cp install.sh contrib/systemd/a-stack.service dist/
          tar -czf dist/a-stack-skill.tar.gz -C skills a-stack
          cd dist
          sha256sum a-stack_linux_*.tar.gz install.sh a-stack.service a-stack-skill.tar.gz > SHA256SUMS
          cat SHA256SUMS
      # GitHub supports attestations on private repositories only with Enterprise Cloud.
      - if: github.event.repository.visibility == 'public' && steps.existing.outputs.exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/a-stack_linux_*.tar.gz
      - if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${prerelease[@]}"
